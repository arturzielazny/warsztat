<section id="hero" class="hero">
  <div class="hero-content">
    <h1 class="hero-title">{{ site.data.contact.business_name }}</h1>
    <p class="hero-tagline">{{ site.data.contact.tagline }}</p>
    <p class="hero-subtitle">{{ site.data.contact.subtitle }}</p>
    <div class="hero-actions">
      <a href="tel:{{ site.data.contact.phones[0].tel }}" class="btn btn-primary">
        Zadzwoń teraz
      </a>
      <a href="#uslugi" class="btn btn-secondary">
        Zobacz usługi
      </a>
    </div>
  </div>
</section>
